name: Deploy KQM sites
on:
  workflow_dispatch:
  push:
    tags:
      - "kqmsim-v[0-9]+.[0-9]+.[0-9]+"
permissions:
  contents: read
concurrency:
  group: deploy-kqm
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/go-setup-and-test
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install UI dependencies
        working-directory: ui
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Check KQM packages
        working-directory: ui
        run: |
          pnpm --filter '@gcsim/kqm*' typecheck
          pnpm --filter @gcsim/kqmworkers test
          pnpm --filter @gcsim/kqmdb test:worker
      - name: Build KQM sites
        working-directory: ui
        run: pnpm build:kqmsim && pnpm build:kqmdb
      - name: Deploy KQM sites
        working-directory: ui
        run: pnpm deploy:kqmsim && pnpm deploy:kqmdb
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c102bcadcefa0897a01701fd28bed543
